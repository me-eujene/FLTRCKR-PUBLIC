  td { padding: 5px 8px; border-bottom: 1px solid #1f2937; vertical-align: top; }
  tr:hover td { background: #1a2030; }
  .pass { color: #4ade80; }
  .fail { color: #f87171; }
  .skip { color: #6b7280; }
  .pending { color: #6b7280; }
  .running { color: #fbbf24; }
  .field-result { display: flex; gap: 4px; align-items: baseline; }
  .expected { color: #6b7280; font-size: 11px; }
  .got { font-size: 12px; }
  .score-cell { font-weight: bold; font-size: 14px; }
  .summary { display: flex; gap: 24px; margin-bottom: 16px; }
  .summary-item { background: #1f2937; padding: 12px 20px; }
  .summary-item .num { font-size: 28px; font-weight: bold; }

  .error-text { color: #f87171; font-size: 11px; max-width: 200px; word-break: break-word; }

  .trace-wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .trace-block { font-size: 11px; line-height: 1.5; }
  .trace-block .trace-label { color: #f90; font-weight: bold; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .trace-block pre { white-space: pre-wrap; word-break: break-word; color: #9ca3af; margin: 0; }
  .toggle-btn { cursor: pointer; color: #6b7280; font-size: 11px; user-select: none; }
  .toggle-btn:hover { color: #ccc; }

function parseDuration(str) {
  if (!str) return null
  const hm = str.trim().match(/^(\d+)h\s*(\d+)m$/)
  if (hm) return `${hm[1].padStart(2,'0')}:${hm[2].padStart(2,'0')}`
  const h = str.trim().match(/^(\d+)h$/)
  if (h) return `${h[1].padStart(2,'0')}:00`
  const m = str.trim().match(/^(\d+)m$/)
  if (m) return `00:${m[1].padStart(2,'0')}`
  return str
}

function parseCSVRow(line) {
  // Handle quoted fields
  const fields = []
  let cur = '', inQuote = false
  for (let i = 0; i < line.length; i++) {
    const c = line[i]
    if (c === '"') { inQuote = !inQuote }
    else if (c === ',' && !inQuote) { fields.push(cur.trim()); cur = '' }
    else cur += c
  }
  fields.push(cur.trim())
  return fields
}

function buildDatasetFromCSV(text) {
  const lines = text.trim().split('\n')
  const header = parseCSVRow(lines[0]).map(h => h.trim())
  const col = name => header.indexOf(name)

  // Detect format: strict GT (has AirlineCode col) vs dirty (has Airline col)
  const isStrict = col('AirlineCode') !== -1

  return lines.slice(1).filter(l => l.trim()).map(line => {
    const f = parseCSVRow(line)
    const get = name => (f[col(name)] || '').trim()

    let dep, arr, code, aircraft, time, date

    if (isStrict) {
      dep      = get('Departure')
      arr      = get('Arrival')
      code     = get('AirlineCode')
      aircraft = get('Aircraft')   // already decoded
      time     = get('Duration')   // already HH:MM
      date     = get('Date')
      const fn = get('FlightNumber') || null
    } else {
      // dirty format — decode on the fly
      const route = get('Route')
      dep      = route.split('→')[0].trim()
      arr      = get('Airport')
      const airlineName = get('Airline')
      code     = AIRLINE_CODE_MAP[airlineName.toLowerCase()] || null
      aircraft = AIRCRAFT_MAP[get('Aircraft')] || get('Aircraft') || null
      time     = parseDuration(get('Flight Time'))
      date     = get('Date')
    }

    const dateStr = date ? ` on ${date}` : ''
    const queryMode = document.getElementById('queryMode')?.value || 'no-airline'
    const airlinePrefix = queryMode === 'with-airline' ? (CODE_TO_NAME[code] || code) + ' ' : ''

    const fn = isStrict ? get('FlightNumber') || null : get('Flight Number').replace(/\D/g, '') || null
    return { dep, arr, code, fn, aircraft, time, date,
             query: `${airlinePrefix}from ${dep} to ${arr}${dateStr}` }
  })
}

document.getElementById('csvFile').addEventListener('change', function() {
  const file = this.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = e => {
    DATASET = buildDatasetFromCSV(e.target.result)
    setStatus(`Loaded <span>${DATASET.length}</span> entries from ${file.name}`)
    document.getElementById('runBtn').disabled = false
  }
  reader.readAsText(file)
})

// ─── Prompts (mirrored from useAIFlightParser.js) ─────────────────────────────
// ── Step 1: REASON ────────────────────────────────────────────────────────────
function getReasoningPrompt(userQuery) {
  return `You are reconstructing a flight record from a user's memory. Use your training knowledge about airlines, their fleets, and typical routes. Do NOT search — reason from what you know.

USER QUERY: ${userQuery}

Analyse the user query. It may or may not contain explicit information about the flight details. 

What are we looking for:
- Departure airport (IATA code)
- Arrival airport (IATA code)
- Airline (IATA code)
- Aircraft type (standard name, e.g. "Boeing 737MAX", "Airbus A320", "Embraer E190")

Perform the next steps:

1. Identify data that cannot be directly extracted from the query.
2. For missing fields use the folliwing logic: 

ROUTE: If route is missing: abort. We cannot infer a route that isn't mentioned at all. Output null for all fields.
DATE: What date was provided?
AIRLINE: Was an airline stated in the query? If yes, preserve it exactly. If no, can you infer one from knowledge of which airlines operate in that region? What is the most likely candidate?
AIRCRAFT: What aircraft does this airline typically operate on this route? Name the most likely type. If multiple types are possible, name the most common one.

Think through your reasoning in prose, then end with OUTPUT containing short values only — no sentences, no explanations.

OUTPUT:
  "departureAirportCode": "3-letter IATA code or null",
  "arrivalAirportCode": "3-letter IATA code or null",
  "airlineCode": "2-letter IATA code or null",
  "aircraftName": "standard name e.g. Boeing 777, Airbus A350, or null"
`
}

STEP 2 — Look up each fact using web search:

// ─── API ───────────────────────────────────────────────────────────────────────
const API_URL = 'https://gen.pollinations.ai/v1/chat/completions'
const MODEL_SEARCH = 'gemini-search'   // grounding enabled, incompatible with json mode
const MODEL_JSON = 'gemini-fast'       // no grounding, supports json mode

const CALL_TIMEOUT_MS = 10000

function fetchWithTimeout(url, options) {
  const timer = new AbortController()
  const id = setTimeout(() => timer.abort(), CALL_TIMEOUT_MS)
  const combined = AbortSignal.any
    ? AbortSignal.any([currentSignal, timer.signal])
    : timer.signal  // fallback: timeout only
  return fetch(url, { ...options, signal: combined }).finally(() => clearTimeout(id))
}

async function callLLM(apiKey, messages, jsonMode = false, modelOverride = null) {
  const model = modelOverride || (jsonMode ? MODEL_JSON : MODEL_SEARCH)
  const body = {
    model,
    messages,
    temperature: 0,
    ...(jsonMode ? { response_format: { type: 'json_object' } } : {})
  }
  const res = await fetchWithTimeout(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify(body)
  })
  if (!res.ok) { const txt = await res.text(); throw new Error(`API ${res.status}: ${txt.slice(0, 200)}`) }
  const data = await res.json()
  return data.choices[0].message.content
}

async function callLLMFull(apiKey, messages, modelOverride) {
  const model = modelOverride || MODEL_SEARCH
  const body = { model, messages, temperature: 0 }
  const res = await fetchWithTimeout(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify(body)
  })
  if (!res.ok) { const txt = await res.text(); throw new Error(`API ${res.status}: ${txt.slice(0, 200)}`) }
  const data = await res.json()
  const choice = data.choices[0]
  const grounding = choice.groundingMetadata || null
  const queries = grounding?.webSearchQueries || []
  return { content: choice.message.content, queries, grounding, rawChoice: choice }
}

// ─── Comparison ───────────────────────────────────────────────────────────────
function timeToMinutes(t) {
  if (!t) return null
  const m = t.match(/^(\d+):(\d+)$/)
  if (!m) return null
  return parseInt(m[1]) * 60 + parseInt(m[2])
}

function compareResults(expected, extracted) {
  const fields = {}
  let score = 0
  let total = 0

  // Route: dep airport
  const depGot = extracted.departureAirportCode
  fields.dep = { expected: expected.dep, got: depGot, pass: depGot === expected.dep }
  total++; if (fields.dep.pass) score++

  // Route: arr airport
  const arrGot = extracted.arrivalAirportCode
  fields.arr = { expected: expected.arr, got: arrGot, pass: arrGot === expected.arr }
  total++; if (fields.arr.pass) score++

  // Airline code
  const airlineGot = extracted.airlineCode
  fields.airline = { expected: expected.code, got: airlineGot, pass: airlineGot === expected.code }
  total++; if (fields.airline.pass) score++

  // Aircraft
  const acGot = extracted.aircraftName
  fields.aircraft = { expected: expected.aircraft, got: acGot, pass: acGot === expected.aircraft }
  total++; if (fields.aircraft.pass) score++

  return { fields, score, total, pct: Math.round((score / total) * 100) }
}

// ─── State ────────────────────────────────────────────────────────────────────
let results = []
let running = false
let currentSignal = null
let abortController = null

// ─── UI helpers ───────────────────────────────────────────────────────────────
function initTable(entries) {
  const tbody = document.getElementById('tableBody')
  tbody.innerHTML = ''
  results = entries.map((e, i) => ({ entry: e, index: i, status: 'pending', extracted: null, comparison: null, error: null, trace: null }))
  results.forEach(r => {
    const tr = document.createElement('tr')
    tr.id = `row-${r.index}`
    tr.className = 'data-row'
    tr.innerHTML = `
      <td><span class="toggle-btn" onclick="toggleTrace(${r.index})">▶ ${r.index + 1}</span></td>
      <td style="max-width:220px;word-break:break-word;font-size:11px">${r.entry.query}</td>
      <td class="pending">—</td>
      <td class="pending">—</td><td class="pending">—</td><td class="pending">—</td>
      <td class="pending">—</td><td class="pending">—</td>
      <td class="pending">—</td><td class="pending">—</td><td></td>`
    tbody.appendChild(tr)

    const traceRow = document.createElement('tr')
    traceRow.id = `trace-${r.index}`
    traceRow.className = 'trace-row'
    traceRow.innerHTML = `<td colspan="11"><div class="trace-wrap" id="trace-content-${r.index}"><span style="color:#555">No trace yet.</span></div></td>`
    tbody.appendChild(traceRow)
  })
}

function updateRow(r) {
  const tr = document.getElementById(`row-${r.index}`)
  if (!tr) return
  tr.className = r.status === 'running' ? 'row-running' : ''

  const c = r.comparison
  const statusCell = r.status === 'running' ? '<span class="running">⏳ running</span>'
    : r.status === 'error' ? `<span class="fail">✗ error</span>`
    : r.status === 'pending' ? '<span class="pending">—</span>'
    : c.pct >= 80 ? `<span class="pass">✓ ${c.pct}%</span>`
    : `<span class="fail">✗ ${c.pct}%</span>`

  function fieldCell(f) {
    if (!f) return '<td class="pending">—</td>'
    const cls = f.pass ? 'pass' : 'fail'
    const got = f.got ?? 'null'
    return `<td><span class="${cls}">${got}</span>${!f.pass ? `<br><span class="expected">exp: ${f.expected}</span>` : ''}</td>`
  }

  const cells = c ? [
    fieldCell(c.fields.dep) + fieldCell(c.fields.arr).replace('<td>', '<td>').replace('</td>', ' <span style="color:#555">→</span></td>'),
    `<td>${fieldCell(c.fields.airline).replace(/<\/?td>/g,'')}</td>`,
    `<td>${fieldCell(c.fields.aircraft).replace(/<\/?td>/g,'')}</td>`,
    `<td class="score-cell ${c.pct>=80?'pass':'fail'}">${c.score}/${c.total}</td>`,
  ] : ['<td>—</td>','<td>—</td>','<td>—</td>','<td>—</td>','<td>—</td>','<td>—</td>']

  const noteCell = r.error
    ? `<td class="error-text">${r.error}</td>`
    : (r.validationFailed?.length ? `<td class="fail" style="font-size:11px">nulled: ${r.validationFailed.join(', ')}</td>` : '<td></td>')

  // Route cell combines dep+arr
  const routeCell = c
    ? `<td><span class="${c.fields.dep.pass?'pass':'fail'}">${c.fields.dep.got??'null'}</span> → <span class="${c.fields.arr.pass?'pass':'fail'}">${c.fields.arr.got??'null'}</span>${(!c.fields.dep.pass||!c.fields.arr.pass)?`<br><span class="expected">exp: ${c.fields.dep.expected} → ${c.fields.arr.expected}</span>`:''}</td>`
    : '<td class="pending">—</td>'

  tr.cells[2].outerHTML = `<td>${statusCell}</td>`
  tr.cells[3].outerHTML = routeCell
  tr.cells[4].outerHTML = c ? `<td><span class="${c.fields.airline.pass?'pass':'fail'}">${c.fields.airline.got??'null'}</span>${!c.fields.airline.pass?`<br><span class="expected">exp: ${c.fields.airline.expected}</span>`:''}</td>` : '<td class="pending">—</td>'
  tr.cells[5].outerHTML = c ? `<td><span class="${c.fields.aircraft.pass?'pass':'fail'}">${c.fields.aircraft.got??'null'}</span>${!c.fields.aircraft.pass?`<br><span class="expected">exp: ${c.fields.aircraft.expected}</span>`:''}</td>` : '<td class="pending">—</td>'
  tr.cells[6].outerHTML = c ? `<td class="score-cell ${c.pct>=80?'pass':'fail'}">${c.score}/${c.total}</td>` : '<td class="pending">—</td>'

  const verdicts = r.extracted?.validation?.verdicts
  function verdictPill(label, val) {
    if (!val) return `<span style="color:#555;font-size:10px">${label}?</span>`
    const cls = val === 'PASS' ? 'pass' : 'fail'
    return `<span class="${cls}" style="font-size:10px">${label}:${val === 'PASS' ? '✓' : '✗'}</span>`
  }
  const judgeCell = verdicts
    ? `<td style="font-size:10px;line-height:1.8">` +
      verdictPill('FID', verdicts.fidelity) + '<br>' +
      verdictPill('RTE', verdicts.route) + '<br>' +
      verdictPill('FLT', verdicts.fleet) +
      `</td>`
    : '<td class="pending">—</td>'
  tr.cells[7].outerHTML = judgeCell
  tr.cells[8].outerHTML = noteCell
}

function updateSummary() {
  const done = results.filter(r => r.status === 'done' || r.status === 'error')
  const passed = results.filter(r => r.comparison?.pct >= 80)
  const failed = results.filter(r => r.status === 'done' && r.comparison?.pct < 80)
  const errors = results.filter(r => r.status === 'error')
  const scores = results.filter(r => r.comparison).map(r => r.comparison.pct)
  const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : 0

  document.getElementById('sumPass').textContent = passed.length
  document.getElementById('sumFail').textContent = failed.length + errors.length
  document.getElementById('sumScore').textContent = scores.length ? avg + '%' : '-'
  document.getElementById('sumTotal').textContent = done.length
  document.getElementById('summary').style.display = 'flex'
}

function toggleTrace(index) {
  const traceRow = document.getElementById(`trace-${index}`)
  const btn = document.querySelector(`#row-${index} .toggle-btn`)
  if (!traceRow) return
  const open = traceRow.classList.toggle('open')
  if (btn) btn.textContent = (open ? '▼ ' : '▶ ') + (index + 1)
}

function updateTraceRow(r) {
  const el = document.getElementById(`trace-content-${r.index}`)
  if (!el || !r.trace) return
  const t = r.trace
  el.innerHTML = `
    <div class="trace-block">
      <div class="trace-label">Step 1 — Reason</div>
      <pre>${escHtml(t.reasoning ?? '—')}</pre>
    </div>
    <div class="trace-block">
      <div class="trace-label">Step 2 — Judge</div>
      ${t.judgeQueries?.length
        ? `<div style="margin-bottom:4px">${t.judgeQueries.map(q => `<span style="background:#1a2a1a;color:#4ade80;font-size:10px;padding:1px 5px;margin-right:4px;border-radius:2px">🔍 ${escHtml(q)}</span>`).join('')}</div>` +
          (t.judgeGrounding?.groundingChunks?.length ? `<div style="margin-bottom:6px">${[...new Set(t.judgeGrounding.groundingChunks.map(c => c.web?.domain).filter(Boolean))].map(d => `<span style="color:#6b7280;font-size:10px;margin-right:6px">↳ ${escHtml(d)}</span>`).join('')}</div>` : '')
        : '<div style="color:#6b3a3a;font-size:10px;margin-bottom:4px">⚠ no search queries returned</div>'}
      <pre>${escHtml(t.judge ?? '—')}</pre>
      ${t.judgeRaw ? `<details style="margin-top:6px"><summary style="color:#555;font-size:10px;cursor:pointer">raw API response</summary><pre style="color:#444;font-size:10px;max-height:200px;overflow:auto">${escHtml(JSON.stringify(t.judgeRaw, null, 2))}</pre></details>` : ''}
    </div>
    <div class="trace-block">
      <div class="trace-label">Step 3 — Extract</div>
      <pre>${escHtml(t.extract ?? '—')}</pre>
    </div>`
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

function parseJudgeVerdicts(judgeText) {
  if (!judgeText) return null
  const parse = (key) => {
    const m = judgeText.match(new RegExp(key + '\\s*:\\s*(PASS|FAIL)', 'i'))
    return m ? m[1].toUpperCase() : null
  }
  return { fidelity: parse('FIDELITY'), route: parse('ROUTE'), fleet: parse('FLEET') }
}

// ─── Main eval runner ─────────────────────────────────────────────────────────
async function runEval() {
  const apiKey = document.getElementById('apiKey').value.trim()
  if (!apiKey) { alert('Enter API key'); return }

  const mode = document.getElementById('runMode').value
  let entries
  if (mode === 'first5') entries = DATASET.slice(0, 5)
  else if (mode === 'first10') entries = DATASET.slice(0, 10)
  else if (mode === 'single') {
    const idx = parseInt(document.getElementById('singleIndex').value)
    entries = [DATASET[idx]]
  } else entries = DATASET

  initTable(entries)
  document.getElementById('summary').style.display = 'none'
  abortController = new AbortController()
  currentSignal = abortController.signal
  running = true
  document.getElementById('runBtn').disabled = true
  document.getElementById('stopBtn').disabled = false

  let completed = 0
  for (const r of results) {
    if (!running) break

    r.status = 'running'
    updateRow(r)
    setStatus(`Running ${r.index + 1}/${results.length}: ${r.entry.query.substring(0, 60)}...`)

    const MAX_ATTEMPTS = 3
    let lastError = null

    for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
      try {
        if (attempt > 1) {
          r.error = `retry ${attempt}/${MAX_ATTEMPTS}…`
          updateRow(r)
          await new Promise(res => setTimeout(res, 1500 * attempt))
        }

        // Step 1: Reason (gemini-fast, parametric knowledge, no grounding)
        const reasonContent = await callLLM(apiKey, [
          { role: 'user', content: getReasoningPrompt(r.entry.query) }
        ], false, MODEL_JSON)

        // Step 2: Judge (gemini-search, grounding enabled, free text)
        const { content: judgeContent, queries: judgeSearchQueries, grounding: judgeGrounding, rawChoice: judgeRaw } = await callLLMFull(apiKey, [
          { role: 'user', content: getJudgePrompt(r.entry.query, reasonContent) }
        ])

        // Step 3: Extract (gemini-fast, structured JSON)
        const extractPrompt = getExtractionPrompt(r.entry.query, reasonContent, judgeContent)
        const extractContent = await callLLM(apiKey, [
          { role: 'user', content: extractPrompt }
        ], true)

        let extracted
        try { extracted = JSON.parse(extractContent) }
        catch { throw new Error('Extract JSON parse failed') }

        // Store full trace
        r.trace = { reasoning: reasonContent, judge: judgeContent, judgeQueries: judgeSearchQueries, judgeGrounding, judgeRaw, extract: extractContent }

        const validation = { reasoning: judgeContent, verdicts: parseJudgeVerdicts(judgeContent) }

        r.extracted = { ...extracted, validation }
        r.validationFailed = []
        r.comparison = compareResults(r.entry, extracted)
        r.status = 'done'
        r.error = null
        lastError = null
        break

      } catch (err) {
        if (err.name === 'AbortError' && !running) { r.status = 'pending'; break }
        lastError = err
        if (attempt === MAX_ATTEMPTS) {
          r.status = 'error'
          r.error = `(${MAX_ATTEMPTS} attempts) ${err.message}`
        }
      }
    }

    if (!running) break

    completed++
    updateRow(r)
    updateTraceRow(r)
    updateSummary()
    document.getElementById('progressFill').style.width = `${(completed / results.length) * 100}%`

    // Small delay to avoid rate limiting
    if (running && completed < results.length) await new Promise(res => setTimeout(res, 500))
  }

  running = false
  document.getElementById('runBtn').disabled = false
  document.getElementById('stopBtn').disabled = true
  setStatus(`Done. ${completed} entries processed.`)
}

function stopEval() {
  running = false
  abortController?.abort()
  document.getElementById('runBtn').disabled = false
  document.getElementById('stopBtn').disabled = true
  setStatus('Stopped.')
}

function setStatus(msg) {
  document.getElementById('statusBar').innerHTML = msg.replace(/(\d+\/\d+)/, '<span>$1</span>')
}

function exportResults() {
  const data = results.map(r => ({
    query: r.entry.query,
    status: r.status,
    trace: r.trace,
    expected: r.entry,
    extracted: r.extracted,
    comparison: r.comparison,
    error: r.error
  }))
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `eval-results-${new Date().toISOString().slice(0,10)}.json`
  a.click()
}

// Init
document.getElementById('runMode').addEventListener('change', function() {
  document.getElementById('singleIndexWrap').style.display = this.value === 'single' ? 'block' : 'none'
})

// Load API key from localStorage if present
const savedKey = localStorage.getItem('pollinations_api_key')
if (savedKey) document.getElementById('apiKey').value = savedKey
document.getElementById('apiKey').addEventListener('change', function() {
  localStorage.setItem('pollinations_api_key', this.value)
})
